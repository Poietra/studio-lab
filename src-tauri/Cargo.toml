[package]
name = "poietra-studio-lab"
version = "0.0.0"
description = "Poietra Studio desktop shell experiment"
authors = ["Poietra"]
edition = "2021"

[lib]
name = "poietra_studio_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
