[package]
name = "poietra-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poietra-eval.workspace = true
poietra-render-wgpu = { path = "../poietra-render-wgpu" }
poietra-scene-ir.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.103"
wasm-bindgen-futures = "=0.4.76"
# Only stable web-sys features may appear here. The WebCodecs encoder types
# (VideoEncoder, EncodedVideoChunk, VideoEncoderConfig) stay hand-bound in
# `export_encoder.rs` because web-sys gates them behind `web_sys_unstable_apis`
# and omits the AVC `avc: { format }` registration member (issue #693).
web-sys = { version = "=0.3.103", features = [
  "OffscreenCanvas",
  "VideoColorPrimaries",
  "VideoColorSpaceInit",
  "VideoFrame",
  "VideoFrameBufferInit",
  "VideoMatrixCoefficients",
  "VideoPixelFormat",
  "VideoTransferCharacteristics",
] }
wgpu = { workspace = true, features = ["std", "webgpu", "wgsl"] }

[dev-dependencies]
png.workspace = true
sha2.workspace = true

[lints]
workspace = true
