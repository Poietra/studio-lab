[package]
name = "poietra-mathtex-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
poietra-mathtex-outline.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[package.metadata.wasm-pack.profile.custom]
# Fat LTO plus LLVM's size optimization compresses better than a subsequent
# Binaryen -Oz pass for this dependency-heavy module, while avoiding minutes of
# build time. Keep this explicit so wasm-pack does not enable its custom-profile
# default optimizer.
wasm-opt = false

[lints]
workspace = true
