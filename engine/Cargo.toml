[workspace]
members = [
  "crates/poietra-eval",
  "crates/poietra-geometry",
  "crates/poietra-render-wgpu",
  "crates/poietra-scene-ir",
  "crates/poietra-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
poietra-geometry = { path = "crates/poietra-geometry" }
poietra-scene-ir = { path = "crates/poietra-scene-ir" }
poietra-eval = { path = "crates/poietra-eval" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
wasm-bindgen = "=0.2.126"
wgpu = { version = "=30.0.0", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
