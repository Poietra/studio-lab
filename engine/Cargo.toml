[workspace]
members = [
  "crates/poietra-eval",
  "crates/poietra-geometry",
  "crates/poietra-mathtex-outline",
  "crates/poietra-mathtex-py",
  "crates/poietra-mathtex-wasm",
  "crates/poietra-render-wgpu",
  "crates/poietra-scene-ir",
  "crates/poietra-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
poietra-geometry = { path = "crates/poietra-geometry" }
poietra-scene-ir = { path = "crates/poietra-scene-ir" }
poietra-eval = { path = "crates/poietra-eval" }
poietra-mathtex-outline = { path = "crates/poietra-mathtex-outline" }
pyo3 = { version = "=0.28.3", features = ["abi3-py310"] }
lyon_tessellation = "=1.0.20"
png = "=0.18.1"
mitex = { git = "https://github.com/mitex-rs/mitex", rev = "51f7210e026ab05d037125247e92d4d023d8a80d" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
thiserror = "2.0"
ttf-parser = "=0.25.1"
typst = "=0.15.1"
typst-layout = "=0.15.1"
wasm-bindgen = "=0.2.126"
wgpu = { version = "=30.0.0", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Full debug info across the dependency tree (wgpu, naga, lyon) grew
# `engine/target` past 11 GB. Line tables keep backtraces and panic
# locations, which is what the test suite and the wasm smoke need.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The MathTex compiler pulls in Typst's complete standard library. Keep its
# browser payload on a size-oriented link path without changing the release
# profile used by the interactive renderer.
[profile.mathtex-wasm-size]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

# The production Python extension is built in a digest-pinned Linux builder.
# Keep the native ABI optimized while omitting symbols that are not shipped.
[profile.mathtex-python-release]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = "symbols"
